<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма Объекта — Авто-Ориентир Харьков</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%236d28d9'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffffff'/%3E%3C/svg%3E">
    <!-- MapLibre GL CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin=""/>
    <link rel="stylesheet" href="style.css?v=20261107_1">
</head>
<body>

<div class="form-container">

    <!-- Строка 1: Ориентир и Метро -->
    <div class="form-row">
        <div class="form-group half-width">
            <div class="label-row">
                <label for="landmark">Ориентир</label>
                <button type="button" class="action-link" data-copy-target="landmark" title="Скопировать ориентиры">Копировать</button>
            </div>
            <textarea id="landmark" name="landmark" placeholder="Например: Павлове Поле, Саржин Яр" rows="2"></textarea>
            <div class="hint" id="landmark_hint">Подтянется автоматически (можно редактировать или кликать по подсказкам)</div>
            <div class="chips-wrap" id="landmark_chips"></div>
        </div>

        <div class="form-group half-width">
            <div class="label-row">
                <label for="metro">Метро</label>
                <button type="button" class="action-link" data-copy-target="metro" title="Скопировать станцию метро">Копировать</button>
            </div>
            <input type="text" id="metro" name="metro" placeholder="Например: Ботанічний сад">
            <div class="hint" id="metro_hint">Подтянется автоматически по координатам дома</div>
            <div class="chips-wrap" id="metro_chips"></div>
        </div>
    </div>

    <!-- Строка 2: Админ. район, ЖК и Класс -->
    <div class="form-row">
        <div class="form-group" style="flex: 1 1 33%;">
            <label for="district"><span class="required">*</span> Админ. район</label>
            <select id="district" name="district">
                <option value="">Выберите район</option>
            </select>
        </div>

        <div class="form-group aw" id="JK_AW" style="flex: 1 1 43%;">
            <label for="complex_search">ЖК</label>
            <div class="input-wrap">
                <input type="text" id="complex_search" placeholder="Нет" autocomplete="off">
                <button type="button" class="clear-btn" id="clear_jk" title="Сбросить ЖК" hidden>&times;</button>
            </div>
            <div class="drop" id="JKD"></div>
            <!-- Синхронизированный select для совместимости с CRM -->
            <select id="complex" name="complex" hidden>
                <option value="all">Все</option>
                <option value="none" selected>Нет</option>
            </select>
        </div>

        <div class="form-group" style="flex: 0 1 18%;">
            <label for="jk_class">Класс</label>
            <input type="text" id="jk_class" name="jk_class" placeholder="—" readonly class="readonly-input">
        </div>
    </div>

    <!-- Выбор конкретного дома внутри многосекционного ЖК -->
    <div class="jk-houses-bar" id="jk_houses_bar" hidden></div>

    <!-- Строка 3: Улица, Номер дома, Номер кв. -->
    <div class="form-row">
        <div class="form-group street-width aw" id="AW">
            <div class="label-row">
                <label for="street"><span class="required">*</span> Улица</label>
                <span class="rename-pill" id="street_rename_badge" hidden></span>
            </div>
            <div class="input-wrap">
                <input type="text" id="street" name="street" placeholder="Укр, рус, старое название или полный адрес..." autocomplete="off">
                <button type="button" class="clear-btn" id="clear_street" title="Очистить улицу" hidden>&times;</button>
            </div>
            <div class="drop" id="SD"></div>
        </div>

        <div class="form-group small-width aw" id="H_AW">
            <label for="house_number">Номер дома</label>
            <div class="input-wrap">
                <input type="text" id="house_number" name="house_number" placeholder="211" autocomplete="off">
                <button type="button" class="clear-btn" id="clear_house" title="Очистить номер дома" hidden>&times;</button>
            </div>
            <div class="drop" id="HD"></div>
        </div>

        <div class="form-group apt-width">
            <label for="apartment_number">Номер кв.</label>
            <input type="text" id="apartment_number" name="apartment_number" placeholder="">
        </div>
    </div>

    <!-- Компактная строка статуса и быстрых действий над картой -->
    <div class="map-bar">
        <div class="map-info">
            <span id="map_status">Кликните по карте, станции метро, ЖК или перетащите маркер для выбора дома</span>
            <span class="meta-links" id="map_links" hidden>
                <span class="sep">•</span>
                <span id="post_display" class="meta-tag" title="Почтовый индекс"></span>
                <a id="gmaps_link" href="#" target="_blank" rel="noopener noreferrer" class="gmaps-link">Google Карты ↗</a>
            </span>
        </div>
        <div class="map-actions">
            <button type="button" class="bar-btn bar-btn-primary" id="btn_copy_all" title="Скопировать все заполненные поля объекта">Скопировать карточку</button>
            <button type="button" class="bar-btn" id="btn_clear" title="Очистить все поля">Сбросить</button>
        </div>
    </div>

    <!-- Карта в стиле Rieltor.ua -->
    <div class="map-shell">
        <div id="map"></div>
        <div class="map-ui-top-right">
            <div class="map-seg">
                <button type="button" class="map-seg-btn active" id="btn_mode_map">Карта</button>
                <button type="button" class="map-seg-btn" id="btn_mode_sat">Супутник</button>
            </div>
            <button type="button" class="map-pill-toggle active" id="btn_toggle_jks" title="Показать / скрыть жилые комплексы на карте">
                <span class="purple-dot-icon"></span> ЖК
            </button>
        </div>
    </div>

</div>

<div class="toast" id="toast" hidden></div>

<!-- MapLibre GL & Turf JS -->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="script.js?v=20261107_1"></script>
</body>
</html>
