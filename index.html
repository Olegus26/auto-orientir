<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма Объекта</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    
    <!-- Ориентир и Метро -->
    <div class="form-row">
        <div class="form-group half-width">
            <label for="landmark">Ориентир</label>
            <!-- Поле для ориентиров (может быть несколько через запятую) -->
            <textarea id="landmark" name="landmark" placeholder="Например: Аэропорт, Парк" readonly class="readonly-input" rows="2" style="resize: none; font-family: Arial, sans-serif;"></textarea>
            <div class="hint">Подтянется автоматически (через запятую)</div>
        </div>

        <div class="form-group half-width">
            <label for="metro">Метро</label>
            <!-- Поле для метро (только одно) -->
            <input type="text" id="metro" name="metro" placeholder="Например: Гагарина" readonly class="readonly-input">
            <div class="hint">Подтянется автоматически (только одно)</div>
        </div>
    </div>

    <!-- Район и ЖК -->
    <div class="form-row">
        <div class="form-group half-width">
            <label for="district"><span class="required">*</span> Админ. район</label>
            <select id="district" name="district" disabled>
                <option value="" disabled selected>Выберите район</option>
            </select>
            <div class="hint">Выбор района ограничивает список ЖК.</div>
        </div>

        <div class="form-group half-width">
            <label for="complex">ЖК</label>
            <select id="complex" name="complex" disabled>
                <option value="all">Все</option>
                <option value="none">Нет</option>
            </select>
            <div class="hint">Выбор ЖК автоматически выставит район.</div>
        </div>
    </div>
    
    <!-- Улица, Номер дома, Номер кв. -->
    <div class="form-row">
        <div class="form-group street-width aw" id="AW">
            <label for="street"><span class="required">*</span> Улица</label>
            <input type="text" id="street" name="street" placeholder="Например: Аерокосмічний (Гагарина) просп." autocomplete="off">
            <div class="drop" id="SD"></div>
        </div>

        <div class="form-group small-width aw" id="H_AW">
            <label for="house_number">Номер дома</label>
            <input type="text" id="house_number" name="house_number" placeholder="211" autocomplete="off">
            <div class="drop" id="HD"></div>
        </div>

        <div class="form-group small-width">
            <label for="apartment_number">Номер кв.</label>
            <input type="text" id="apartment_number" name="apartment_number" placeholder="">
        </div>
    </div>

    <!-- Карта -->
    <div id="map"></div>

</div>

<!-- Leaflet & Turf JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="script.js"></script>
</body>
</html>
